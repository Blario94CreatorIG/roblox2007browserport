name: Deploy MiiEngine browser preview

on:
  push:
    branches:
      - feature/mii-engine-avatar-integration
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload browser game
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
